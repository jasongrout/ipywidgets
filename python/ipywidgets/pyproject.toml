[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "ipywidgets"
dynamic = ["version"]
authors = [
  { name = "Jupyter Development Team", email = "jupyter@googlegroups.com" },
]
license = { text = "BSD 3-Clause License" }
description = "Jupyter interactive widgets"
readme = "README.md"
keywords = [
  "Interactive",
  "Interpreter",
  "Shell",
  "Web",
  "ipython",
  "widgets",
  "Jupyter",
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Jupyter",
]
requires-python = ">=3.7"
dependencies = [
  "comm>=0.1.3",
  "ipython>=6.1.0",
  "traitlets>=4.3.1",
  "widgetsnbextension~=4.0.14",
  "jupyterlab_widgets~=3.0.15",
]

[project.urls]
Homepage = "http://jupyter.org"

[project.optional-dependencies]
test = [
  "jsonschema",
  "ipykernel",
  "pytest>=3.6.0",
  "pytest-cov",
  "pytz",
]

[tool.setuptools]
zip-safe = false
platforms = ["Linux", "Mac OS X", "Windows"]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "ipywidgets._version.__version__" }

[tool.setuptools.packages.find]
include = ["ipywidgets*"]

[tool.setuptools.package-data]
ipywidgets = ["state.schema.json", "view.schema.json"]
# Test data needs to be packaged until tests are moved out of module
"ipywidgets.widgets.tests" = ["data/jupyter-logo-transparent.png"]
