name: ipywidgets_docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.14,<3.15 # build
  - python-build
  - pip
  - packaging
  - jupyter-builder
  - jupyterlab >=4,<5
  # pin to nodejs LTS: nodejs 26+ cannot require() the yargs 16 pulled in by lerna 5
  - nodejs >=24,<25
  # dependencies
  - jupyter_client
  # docs
  - docutils >=0.19
  - jupyterlab-myst
  - myst-nb >=0.17
  - pandoc
  - pydata-sphinx-theme
  - sphinx
  - sphinx-autobuild
  - sphinx-autodoc-typehints
  - sphinx-copybutton
  - sphinxext-rediraffe
  # demo
  - bqplot
  - ipykernel
  - ipyleaflet
  - jupyterlite-core >=0.8.0,<0.9.0
  - jupyterlite-pyodide-kernel >=0.8.0,<0.9.0
  - matplotlib-base
  - numpy
  - scikit-image
  - scikit-learn
  - sympy
