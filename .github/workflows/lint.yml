name: Lint

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install jupyterlab pre-commit

      - name: yarn install, integrity, lint, pre-commit
        run: |
          jlpm --immutable
          jlpm integrity
          jlpm lint:check
          pre-commit run --all-files --show-diff-on-failure
