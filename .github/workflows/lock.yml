name: 'Lock Closed Threads'

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: '90'
          add-issue-labels: 'resolved-locked'
          pr-inactive-days: '90'
          add-pr-labels: 'resolved-locked'
