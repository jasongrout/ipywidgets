# Git hooks, managed by pre-commit (https://pre-commit.com).
#
# Install them once with:
#
#     pip install pre-commit
#     pre-commit install
#
# After that, `git commit` formats and lints the files you staged. To check
# everything at once, run `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # These shell out to the package.json scripts rather than pinning their own
  # copies of prettier and eslint, so there is one set of versions to keep up
  # to date and the hooks always agree with `yarn lint:check`. They need
  # `yarn install` to have been run; `yarn lint` does the same thing if you
  # would rather not install the hooks.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: yarn
        args: [run, 'prettier:files']
        language: system
        types_or: [ts, tsx, javascript, jsx, css, json, yaml, markdown]
        # Notebooks are JSON, but prettier has no parser for them.
        exclude: \.ipynb$

      - id: eslint
        name: eslint
        entry: yarn
        args: [run, 'eslint:files']
        language: system
        types_or: [ts, tsx]
